<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pediatric Anesthesia Calculator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&family=Roboto+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #2b5876, #4e4376);
        --primary-dark: #2b5876;
        --primary-light: #4e4376;
        --primary-alpha: rgba(43, 88, 118, 0.1);
        --glass-bg: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.2);
        --glass-blur: blur(20px);
        --text-light: #ffffff;
        --text-dark: #2c3e50;
        --text-muted: #666;
        --text-primary: #2b5876;
        --bg-light: #f8f9fa;
        --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        --white: #ffffff;
        --shadow-light: rgba(0, 0, 0, 0.1);
        --shadow-medium: rgba(0, 0, 0, 0.15);
        --shadow-heavy: rgba(0, 0, 0, 0.25);
        --shadow-primary: 0 4px 15px rgba(43, 88, 118, 0.2);
        --border-radius: 12px;
        --border-radius-lg: 16px;
        --transition: all 0.3s ease;
        --transition-fast: all 0.2s ease;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        background: var(--bg-gradient);
        line-height: 1.4;
        font-weight: 400;
        color: var(--text-dark);
        font-size: 13px;
      }

      /* Dashboard Layout */
      .dashboard-container {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
        gap: 0;
      }

      /* Left Sidebar - Patient Info Panel */
      .patient-panel {
        background: var(--primary-gradient);
        padding: 1rem;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        color: var(--text-light);
      }

      .patient-panel-header {
        text-align: center;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .patient-panel-header h1 {
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 0.25rem;
      }

      .patient-panel-header p {
        font-size: 0.7rem;
        opacity: 0.8;
      }

      .patient-form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .patient-input-group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .patient-input-group label {
        font-size: 0.7rem;
        font-weight: 600;
        opacity: 0.9;
      }

      .patient-input-group input {
        padding: 0.5rem 0.6rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.15);
        color: var(--text-light);
        font-size: 0.85rem;
        font-weight: 600;
        transition: var(--transition-fast);
      }

      .patient-input-group input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .patient-input-group input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .btn-calculate-sidebar {
        margin-top: 0.5rem;
        padding: 0.6rem 1rem;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        color: var(--text-light);
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn-calculate-sidebar:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .btn-settings-sidebar {
        padding: 0.5rem 0.8rem;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: var(--text-light);
        font-weight: 500;
        font-size: 0.75rem;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .btn-settings-sidebar:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Airway Info Section in Sidebar */
      .airway-info {
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
      }

      .airway-info-header {
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        opacity: 0.9;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .airway-info-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.35rem 0.5rem;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        margin-bottom: 0.4rem;
      }

      .airway-info-label {
        font-size: 0.7rem;
        opacity: 0.9;
      }

      .airway-info-value {
        font-size: 0.8rem;
        font-weight: 700;
        font-family: "Roboto Mono", monospace;
      }

      .airway-note {
        font-size: 0.6rem;
        opacity: 0.8;
        line-height: 1.35;
      }

      /* Main Content Area */
      .main-content {
        padding: 0.75rem;
        overflow-y: auto;
      }

      /* Calculator Grid */
      .calculator-grid {
        display: grid;
        gap: 0.6rem;
        grid-template-columns: repeat(2, 1fr);
      }

      @media (min-width: 900px) {
        .calculator-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      @media (min-width: 1200px) {
        .calculator-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      @media (min-width: 1500px) {
        .calculator-grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      @media (min-width: 1800px) {
        .calculator-grid {
          grid-template-columns: repeat(6, 1fr);
        }
      }

      /* Compact Calculator Card */
      .calculator-card {
        background: hsla(0, 0%, 100%, 0.95);
        backdrop-filter: blur(10px);
        border-radius: var(--border-radius);
        padding: 0.6rem;
        transition: var(--transition-fast);
        border: 1px solid rgba(0, 0, 0, 0.06);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      .calculator-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--primary-gradient);
        transform: scaleX(0);
        transition: transform 0.2s ease;
        transform-origin: left;
      }

      .calculator-card:hover::before {
        transform: scaleX(1);
      }

      .calculator-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        background: #fff;
      }

      /* Card Header */
      .calculator-card-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }

      .card-icon {
        width: 28px;
        height: 28px;
        background: var(--primary-gradient);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .card-icon i {
        font-size: 0.75rem;
        color: #fff;
      }

      .card-icon.airway {
        background: linear-gradient(135deg, #17a2b8, #138496);
      }
      .card-icon.induction {
        background: linear-gradient(135deg, #2b5876, #1a365d);
      }
      .card-icon.muscle {
        background: linear-gradient(135deg, #4e4376, #3a2d58);
      }
      .card-icon.analgesic {
        background: linear-gradient(135deg, #28a745, #1e7e34);
      }
      .card-icon.emergency {
        background: linear-gradient(135deg, #ffc107, #d39e00);
      }
      .card-icon.sedation {
        background: linear-gradient(135deg, #6f42c1, #5a2d7e);
      }

      .calculator-card h3 {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--primary-dark);
        margin: 0;
        line-height: 1.2;
      }

      /* Card Body - Inputs */
      .calculator-card-body {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        margin-bottom: 0.4rem;
      }

      .compact-input {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .compact-input label {
        font-size: 0.65rem;
        color: var(--text-muted);
        min-width: 65px;
        flex-shrink: 0;
      }

      .compact-input input {
        flex: 1;
        padding: 0.3rem 0.4rem;
        font-size: 0.75rem;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 5px;
        background: var(--bg-light);
        min-width: 0;
        transition: var(--transition-fast);
      }

      .compact-input input:focus {
        outline: none;
        border-color: var(--primary-dark);
        background: var(--white);
      }

      /* Info Text */
      .info-text {
        font-size: 0.6rem;
        color: var(--text-muted);
        background: var(--primary-alpha);
        padding: 0.3rem 0.5rem;
        border-radius: 4px;
        border-left: 2px solid var(--primary-dark);
        margin-bottom: 0.4rem;
        line-height: 1.3;
      }

      /* MIX (조제 방법) Box — 농도를 바꾸면 조제 방법이 함께 바뀝니다 */
      .mix-box {
        font-size: 0.6rem;
        background: #fffdf0;
        border: 1px solid rgba(214, 158, 46, 0.35);
        border-radius: 5px;
        padding: 0.3rem 0.45rem;
        margin-bottom: 0.4rem;
        line-height: 1.4;
        color: var(--text-dark);
      }

      .mix-box summary {
        cursor: pointer;
        list-style: none;
      }

      .mix-box summary::-webkit-details-marker {
        display: none;
      }

      .mix-box summary::before {
        content: "▸ ";
        color: #b7791f;
      }

      .mix-box[open] summary::before {
        content: "▾ ";
      }

      .mix-box[open] summary {
        margin-bottom: 0.15rem;
      }

      .mix-box .mix-h {
        font-weight: 700;
        color: #b7791f;
        margin-right: 0.25rem;
      }

      .mix-box b {
        color: var(--primary-dark);
      }

      .mix-box .mix-sub {
        color: var(--text-muted);
        display: block;
      }

      .mix-box .mix-warn {
        color: #c53030;
        font-weight: 600;
        display: block;
      }

      .section-label {
        font-size: 0.6rem;
        font-weight: 700;
        color: var(--primary-dark);
        margin-top: 0.15rem;
      }

      /* 주의 · 연령 (접이식) */
      .caution {
        font-size: 0.58rem;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
        line-height: 1.35;
      }

      .caution summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--primary-dark);
      }

      .caution p {
        margin-top: 0.2rem;
      }

      .caution b {
        color: var(--text-dark);
      }

      .age-flag {
        display: none;
        font-size: 0.58rem;
        font-weight: 600;
        color: #c53030;
        background: #fdecea;
        border-radius: 4px;
        padding: 0.2rem 0.4rem;
        margin-bottom: 0.4rem;
      }

      .age-flag.show {
        display: block;
      }

      .dose-cap {
        font-size: 0.55rem;
        font-weight: 700;
        margin-left: 0.2rem;
        opacity: 0.85;
      }

      /* Result Box */
      .result-box {
        background: hsla(0, 0%, 98%, 1);
        border-radius: 8px;
        padding: 0.35rem;
        margin-top: auto;
        border: 1px solid rgba(43, 88, 118, 0.08);
      }

      .result-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.25rem 0.35rem;
        border-radius: 6px;
        transition: var(--transition-fast);
      }

      .result-item + .result-item {
        margin-top: 0.2rem;
      }

      .result-label {
        display: flex;
        align-items: center;
        color: var(--text-dark);
        font-size: 0.65rem;
        font-weight: 600;
      }

      .result-label i {
        margin-right: 0.4rem;
        color: var(--primary-dark);
        font-size: 0.7rem;
        width: 14px;
        text-align: center;
      }

      .result-value {
        padding: 0.25rem 0.5rem;
        border-radius: 5px;
        min-width: 55px;
        text-align: center;
        transition: var(--transition-fast);
        font-weight: 600;
        background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        border: 1px dashed #cbd5e0;
        color: #64748b;
        font-size: 0.7rem;
      }

      .result-item.has-result .result-value {
        background: var(--primary-gradient);
        color: var(--text-light);
        border: none;
        font-weight: 700;
        box-shadow: 0 3px 10px rgba(43, 88, 118, 0.25);
        font-family: "Roboto Mono", monospace;
        font-size: 0.75rem;
      }

      /* Dual dose display for mg and ml */
      .dual-dose-value {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        padding: 0.25rem 0.5rem;
        border-radius: 5px;
        min-width: 70px;
        text-align: center;
        transition: var(--transition-fast);
        font-weight: 600;
        background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        border: 1px dashed #cbd5e0;
      }

      .result-item.has-result .dual-dose-value {
        background: var(--primary-gradient);
        border: none;
        box-shadow: 0 3px 10px rgba(43, 88, 118, 0.25);
      }

      .dual-dose-value .dose-mg {
        font-size: 0.7rem;
        font-weight: 700;
        color: #64748b;
      }

      .dual-dose-value .dose-ml {
        font-size: 0.6rem;
        color: #94a3b8;
      }

      .result-item.has-result .dual-dose-value .dose-mg {
        color: var(--text-light);
        font-family: "Roboto Mono", monospace;
      }

      .result-item.has-result .dual-dose-value .dose-ml {
        color: rgba(255, 255, 255, 0.8);
      }

      /* Settings Modal */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(43, 88, 118, 0.6);
        backdrop-filter: blur(8px);
        animation: fadeIn 0.3s ease-out;
      }

      .modal-content {
        background-color: var(--white);
        margin: 5% auto;
        padding: 2rem;
        border-radius: 24px;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        animation: slideInDown 0.3s ease-out;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
        position: relative;
      }

      .modal-content::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--primary-gradient);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #ecf0f1;
      }

      .modal-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text-dark);
      }

      .close {
        color: #aaa;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        margin-left: auto;
      }

      .close:hover {
        color: var(--primary-dark);
      }

      .concentration-grid {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 0.8rem;
        align-items: center;
        margin-bottom: 0.8rem;
        padding: 0.8rem;
        background: var(--bg-light);
        border-radius: 8px;
      }

      .concentration-label {
        font-weight: 500;
        color: var(--text-dark);
        font-size: 0.85rem;
      }

      .concentration-input {
        padding: 0.4rem;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        text-align: center;
        font-size: 0.85rem;
      }

      .concentration-unit {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .modal-save-btn {
        background: var(--primary-gradient);
        color: var(--text-light);
        border: none;
        padding: 0.8rem 1.8rem;
        border-radius: 25px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 1.5rem auto 0;
      }

      .modal-save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(43, 88, 118, 0.4);
      }

      /* Mobile Responsive */
      @media (max-width: 768px) {
        .dashboard-container {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        .patient-panel {
          position: relative;
          height: auto;
          padding: 0.75rem;
        }

        .patient-form {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 0.5rem;
        }

        .patient-input-group {
          flex: 1;
          min-width: 80px;
        }

        .btn-calculate-sidebar {
          flex: 1;
          min-width: 100px;
        }

        .airway-info {
          margin-top: 0.75rem;
          padding-top: 0.75rem;
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
        }

        .airway-info-header {
          width: 100%;
          margin-bottom: 0.25rem;
        }

        .airway-info-item {
          flex: 1;
          min-width: 80px;
        }

        .main-content {
          padding: 0.5rem;
        }

        .calculator-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 0.5rem;
        }
      }

      @media (max-width: 480px) {
        .calculator-grid {
          grid-template-columns: 1fr;
        }

        .patient-form {
          flex-direction: column;
        }

        .patient-input-group {
          min-width: 100%;
        }

        .concentration-grid {
          grid-template-columns: 1fr;
          gap: 0.4rem;
          text-align: center;
        }
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(43, 88, 118, 0.3);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(43, 88, 118, 0.5);
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideInDown {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Left Sidebar - Patient Info -->
      <aside class="patient-panel">
        <div class="patient-panel-header">
          <h1><i class="fas fa-child"></i> Ped Calculator</h1>
          <p>Pediatric Anesthesia Dosage</p>
        </div>
        <form class="patient-form" onsubmit="event.preventDefault(); calculateAll();">
          <div class="patient-input-group">
            <label for="age">Age (years)</label>
            <input type="number" id="age" placeholder="Age" step="0.1" min="0" max="18" />
          </div>
          <div class="patient-input-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="Height" min="30" max="200" />
          </div>
          <div class="patient-input-group">
            <label for="weight">Weight (kg) *</label>
            <input type="number" id="weight" placeholder="Weight" step="0.1" min="1" max="120" required />
          </div>
          <button type="submit" class="btn-calculate-sidebar">
            <i class="fas fa-calculator"></i> Calculate
          </button>
          <button type="button" class="btn-settings-sidebar" onclick="openSettings()">
            <i class="fas fa-cog"></i> Concentrations
          </button>
        </form>

        <!-- Airway Info Section -->
        <div class="airway-info">
          <div class="airway-info-header">
            <i class="fas fa-lungs"></i> Airway Management
          </div>
          <div class="airway-info-item">
            <span class="airway-info-label">ETT cuffed</span>
            <span class="airway-info-value" id="ett_cuffed">-</span>
          </div>
          <div class="airway-info-item">
            <span class="airway-info-label">ETT uncuffed</span>
            <span class="airway-info-value" id="ett_uncuffed">-</span>
          </div>
          <div class="airway-info-item">
            <span class="airway-info-label">ETT Depth (oral)</span>
            <span class="airway-info-value" id="ett_depth">-</span>
          </div>
          <div class="airway-info-item">
            <span class="airway-info-label">C-Line (Rt IJ)</span>
            <span class="airway-info-value" id="c_line">-</span>
          </div>
          <p class="airway-note" id="airway_note"></p>
        </div>
      </aside>

      <!-- Main Content - Drug Cards (DRUGS 배열에서 자동 생성) -->

          ageWarn: [{ lt: 1 / 12, msg: "⚠ 1개월 미만 — 허가 외" }],
          mix: { amt: 4, unit: "mg", vol: 2, n: 1, cu: "mg", label: "4mg/2ml", dil: "NS",
            std: "원액 4mg/2ml = 2mg/ml (희석 없음)" }
        }
      ];

      const ICON_CLASS = {
        induction: "induction", muscle: "muscle", analgesic: "analgesic",
        sedation: "sedation", emergency: "emergency"
      };

      // ===== Card rendering =====
      function concInputHtml(inputId, value, cu) {
        return `
              <div class="compact-input">
                <label>Conc (${cu}/ml)</label>
                <input type="number" id="${inputId}" data-conc="${cu}/ml" value="${value}" step="0.1" min="0" />
              </div>`;
      }

      function doseItemHtml(drugId, i, label) {
        return `
              <div class="result-item" id="${drugId}_d${i}_item">
                <div class="result-label"><i class="fas fa-tint"></i> <span id="${drugId}_d${i}_label">${label}</span></div>
                <div class="dual-dose-value" id="${drugId}_d${i}">
                  <span class="dose-mg">-</span>
                  <span class="dose-ml">-</span>
                </div>
              </div>`;
      }

      // MIX 는 접힌 상태로 시작 — 필요할 때 펼쳐 봅니다
      function mixBoxHtml(inputId, m) {
        return `<details class="mix-box"><summary><span class="mix-h">MIX${m.title ? " · " + m.title : ""}</span>조제 방법</summary><div id="${inputId}_mix"></div></details>`;
      }

      function cardHtml(drug) {
        let body = concInputHtml(drug.id + "_conc", drug.conc, drug.cu);
        const results = drug.doses
          .map((dz, i) => doseItemHtml(drug.id, i, dz.l || "Dose"))
          .join("");

        let infHtml = "";
        if (drug.inf) {
          const inf = drug.inf;
          infHtml = `
            <div class="calculator-card-body">
              <div class="section-label">C.I. (지속주입)</div>
              ${inf.conc ? concInputHtml(drug.id + "_inf_conc", inf.conc, drug.cu) : ""}
              <div class="compact-input">
                <label>${inf.l}</label>
                <input type="number" id="${drug.id}_inf_rate" value="${inf.def}" step="${inf.step}" min="0" />
              </div>
            </div>
            ${inf.mix ? mixBoxHtml(drug.id + "_inf_conc", inf.mix) : ""}`;
        }

        return `
          <div class="calculator-card" data-drug="${drug.id}">
            <div class="calculator-card-header">
              <div class="card-icon ${ICON_CLASS[drug.cat]}"><i class="fas ${drug.icon}"></i></div>
              <h3>${drug.name}</h3>
            </div>
            <div class="calculator-card-body">${body}
            </div>
            ${mixBoxHtml(drug.id + "_conc", drug.mix)}
            ${infHtml}
            <p class="info-text">${drug.info}</p>
            <div class="age-flag" id="${drug.id}_age_flag"></div>
            ${drug.caution ? `<details class="caution"><summary>주의 · 연령</summary><p>${drug.caution}</p></details>` : ""}
            <div class="result-box">${results}${drug.inf ? `
              <div class="result-item" id="${drug.id}_inf_item">
                <div class="result-label"><i class="fas fa-tachometer-alt"></i> C.I. (ml/hr)</div>
                <div class="result-value" id="${drug.id}_inf">-</div>
              </div>` : ""}
            </div>
          </div>`;
      }

      function renderCards() {
        document.getElementById("drugGrid").innerHTML = DRUGS.map(cardHtml).join("");
      }

      // ===== MIX (조제 방법) — 성인 계산기와 같은 방식 =====
      // 농도 입력값에 맞춰 "앰플 + 희석액 = 총량" 을 자동 계산합니다.
      //  amt/unit/vol : 앰플(바이알) 1개의 약물량·단위·부피 (분말이면 vol 0)
      //  n            : 조제에 쓰는 앰플 수
      //  cu           : 농도 입력칸의 단위 (…/ml)
      //  dil          : 희석액
      //  std          : 표준 조제 (anesthesia-manual 소아 탭 기준)
      //  syr          : 해당 부피(ml) 시린지 조제법도 함께 표시
      //  neat         : 원액 사용 약물
      const MASS = { mcg: 0.001, mg: 1, g: 1000 };
      function convUnit(v, from, to) {
        if (from === to) return v;
        if (MASS[from] && MASS[to]) return (v * MASS[from]) / MASS[to];
        return NaN;
      }
      const fmt = (x) =>
        String(x >= 20 ? Math.round(x * 10) / 10 : Math.round(x * 100) / 100);

      function mixText(m, conc) {
        const std = '<span class="mix-sub">표준: ' + m.std + (m.note ? " · " + m.note : "") + "</span>";
        if (!(conc > 0)) return "농도를 입력하세요" + std;
        if (m.neat) return "<b>원액 사용</b>" + std;

        const amtTotal = convUnit(m.amt * m.n, m.unit, m.cu);
        const total = amtTotal / conc;
        const drugVol = m.vol * m.n;
        const ampTxt = m.n + (m.vol > 0 ? "@" : "ⓥ") + "(" + m.label + ")";
        let line;
        if (m.vol > 0 && Math.abs(total - drugVol) < drugVol * 0.001) {
          line = "<b>원액 그대로</b> (" + m.label + ")";
        } else if (total < drugVol) {
          const stock = convUnit(m.amt, m.unit, m.cu) / m.vol;
          line = '<span class="mix-warn">⚠ 원액 농도가 ' + fmt(stock) + " " + m.cu +
            "/ml 이므로 그보다 진하게 조제할 수 없습니다</span>";
        } else {
          line = "<b>" + ampTxt + " + " + m.dil + " " + fmt(total - drugVol) + "ml</b> = 총 " + fmt(total) + "ml";
        }
        // 시린지 조제 (앰플 일부만 사용)
        let syr = "";
        if (m.syr && m.vol > 0) {
          const stock = convUnit(m.amt, m.unit, m.cu) / m.vol;
          const draw = (conc * m.syr) / stock;
          if (draw < m.syr && Math.abs(total - m.syr) > 0.5) {
            syr = '<span class="mix-sub">' + m.syr + "ml 시린지: 원액 " + fmt(draw) + "ml + " + m.dil + " " +
              fmt(m.syr - draw) + "ml</span>";
          }
        }
        return line + syr + std;
      }

      function updateMixes() {
        DRUGS.forEach((drug) => {
          const pairs = [[drug.id + "_conc", drug.mix]];
          if (drug.inf && drug.inf.mix) pairs.push([drug.id + "_inf_conc", drug.inf.mix]);
          pairs.forEach(([inputId, m]) => {
            const el = document.getElementById(inputId + "_mix");
            const input = document.getElementById(inputId);
            if (el && input && m) el.innerHTML = mixText(m, parseFloat(input.value));
          });
        });
      }

      // ===== Airway =====
      const floorHalf = (x) => Math.floor(x * 2) / 2;
      const r1 = (x) => Math.round(x * 10) / 10;

      function calculateAirway(age, height, weight) {
        const set = (id, v) => (document.getElementById(id).textContent = v);
        const note = [];

        if (age >= 1) {
          // Cole 공식 (만 1–12세): uncuffed 4 + age/4, cuffed 3.5 + age/4
          // 튜브는 0.5 단위 → 계산값 이하의 가장 가까운 크기, ±0.5 함께 준비
          const unc = 4 + age / 4;
          const cuf = 3.5 + age / 4;
          set("ett_uncuffed", floorHalf(unc).toFixed(1) + " mm");
          set("ett_cuffed", floorHalf(cuf).toFixed(1) + " mm");
          set("ett_depth", r1(12 + age / 2) + " cm");
          note.push("ID 계산 " + r1(cuf) + "(c)/" + r1(unc) + "(u) · ±0.5 함께 준비");
          if (age > 12) note.push("12세 초과 — 성인 기준도 확인");
        } else if (age >= 0 && !isNaN(age)) {
          // 1세 미만: 나이 공식 대신 체중 기준
          const unc = weight > 0 && weight < 3 ? 3.0 : 3.5;
          set("ett_uncuffed", unc.toFixed(1) + " mm");
          set("ett_cuffed", unc === 3.0 ? "-" : "3.0 mm");
          // 깊이: 5kg 이하 체중 + 6 (Tochen), 그 외 3 × ID
          set("ett_depth", r1(weight > 0 && weight <= 5 ? weight + 6 : 3 * unc) + " cm");
          note.push("1세 미만 — 체중 기준 (깊이: ≤5kg 체중+6, 그 외 3×ID)");
        } else {
          set("ett_uncuffed", "-");
          set("ett_cuffed", "-");
          set("ett_depth", "-");
        }

        // C-line 깊이 (Andropoulos 2001, Rt IJ·SCV, RA 위 SVC):
        //  키 ≤100cm → 키/10 − 1,  키 >100cm → 키/10 − 2
        if (height > 0) {
          set("c_line", r1(height / 10 - (height <= 100 ? 1 : 2)) + " cm");
        } else {
          set("c_line", "-");
        }
        document.getElementById("airway_note").textContent = note.join(" · ");
      }

      // ===== Drug doses =====
      function readConc(id) {
        const el = document.getElementById(id);
        const v = el ? parseFloat(el.value) : NaN;
        return v > 0 ? v : NaN;
      }

      function setDose(drugId, i, text1, text2) {
        const el = document.getElementById(drugId + "_d" + i);
        const item = document.getElementById(drugId + "_d" + i + "_item");
        el.querySelector(".dose-mg").innerHTML = text1;
        el.querySelector(".dose-ml").textContent = text2;
        item.classList.toggle("has-result", text1 !== "-");
      }

      function calculateDrug(drug, weight, age) {
        const conc = readConc(drug.id + "_conc");
        const hasW = weight > 0;

        drug.doses.forEach((dz, i) => {
          let perKg = dz.d, label = dz.l, fixed = null;
          if (dz.pick) {
            const p = dz.pick(weight, age);
            perKg = p.d; label = p.l; fixed = p.fixed != null ? p.fixed : null;
          }
          document.getElementById(drug.id + "_d" + i + "_label").textContent = label;

          if (!hasW || isNaN(conc)) {
            setDose(drug.id, i, "-", "-");
            return;
          }
          let total = fixed != null ? fixed : weight * perKg;
          let capped = false;
          if (dz.max && total > dz.max) {
            total = dz.max;
            capped = true;
          }
          const vol = total / conc;
          let volTxt = vol.toFixed(2) + " ml";
          if (dz.over) volTxt += " · " + (vol * 60 / dz.over).toFixed(1) + " ml/hr×" + dz.over + "분";
          setDose(drug.id, i,
            total.toFixed(2) + " " + drug.cu + (capped ? '<span class="dose-cap">MAX</span>' : ""),
            volTxt);
        });

        if (drug.inf) {
          const infConc = drug.inf.conc ? readConc(drug.id + "_inf_conc") : conc;
          const rate = parseFloat(document.getElementById(drug.id + "_inf_rate").value);
          const el = document.getElementById(drug.id + "_inf");
          const item = document.getElementById(drug.id + "_inf_item");
          if (hasW && infConc > 0 && rate >= 0) {
            const mlhr = (rate * weight * (drug.inf.perMin ? 60 : 1)) / infConc;
            el.textContent = mlhr.toFixed(2);
            item.classList.add("has-result");
          } else {
            el.textContent = "-";
            item.classList.remove("has-result");
          }
        }

        const flag = document.getElementById(drug.id + "_age_flag");
        const w = (drug.ageWarn || []).find((a) => age >= 0 && age < a.lt);
        flag.textContent = w ? w.msg : "";
        flag.classList.toggle("show", !!w);
      }

      function calculateAll() {
        const age = parseFloat(document.getElementById("age").value);
        const height = parseFloat(document.getElementById("height").value);
        const weight = parseFloat(document.getElementById("weight").value);

        calculateAirway(age, height, weight);
        DRUGS.forEach((drug) => calculateDrug(drug, weight, age));
      }

      // ===== Concentration settings modal =====
      function openSettings() {
        const settingsContainer = document.getElementById("concentrationSettings");
        let html = "";
        DRUGS.forEach((drug) => {
          const ids = [[drug.id + "_conc", drug.name + (drug.inf && drug.inf.conc ? " (Bolus)" : "")]];
          if (drug.inf && drug.inf.conc) ids.push([drug.id + "_inf_conc", drug.name + " (C.I.)"]);
          ids.forEach(([inputId, label]) => {
            const input = document.getElementById(inputId);
            html += `
            <div class="concentration-grid">
              <span class="concentration-label">${label}</span>
              <input type="number" class="concentration-input" data-target="${inputId}"
                     value="${input.value}" step="0.1" min="0">
              <span class="concentration-unit">${input.dataset.conc}</span>
            </div>`;
          });
        });
        settingsContainer.innerHTML = html;
        document.getElementById("settingsModal").style.display = "block";
      }

      function closeSettings() {
        document.getElementById("settingsModal").style.display = "none";
      }

      function saveSettings() {
        document.querySelectorAll(".modal .concentration-input").forEach((input) => {
          const value = parseFloat(input.value);
          if (value > 0) document.getElementById(input.dataset.target).value = value;
        });
        closeSettings();
        updateMixes();
        calculateAll();
      }

      // Real-time calculation
      document.addEventListener("DOMContentLoaded", function () {
        renderCards();
        let calculationTimeout;

        document.querySelectorAll(".patient-panel input, .calculator-grid input").forEach((input) => {
          input.addEventListener("input", () => {
            updateMixes();
            clearTimeout(calculationTimeout);
            calculationTimeout = setTimeout(calculateAll, 300);
          });
        });

        updateMixes();
        calculateAll();
      });

      // Close modal when clicking outside
      window.addEventListener("click", function (event) {
        if (event.target === document.getElementById("settingsModal")) closeSettings();
      });
    </script>
  </body>
</html>
